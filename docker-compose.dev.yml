version: '3.8'

services:
  # Local PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: store_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: master_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local Backend Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store_backend_dev
    restart: always
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/master_db?schema=public"
      JWT_SECRET: "super_secret_jwt_key_store_app_2026"
      REFRESH_SECRET: "super_secret_refresh_key_store_app_2026"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
