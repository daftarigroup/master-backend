name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'master-backend/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'master-backend/**'

jobs:
  # ================================================
  # 1. TEST & BUILD JOB
  # ================================================
  test-and-build:
    name: Test & Build TypeScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: master-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: master-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Compile Production Build
        run: npm run build

  # ================================================
  # 2. DOCKER BUILD & PUBLISH JOB
  # ================================================
  docker-build-push:
    name: Build & Push Docker Image
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    defaults:
      run:
        working-directory: master-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: master-backend
          file: master-backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/store-backend:latest
            ghcr.io/${{ github.repository_owner }}/store-backend:${{ github.sha }}

  # ================================================
  # 3. DEPLOYMENT STAGE
  # ================================================
  deploy:
    name: Deploy to Production
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deployment Notification
        run: |
          echo "🚀 Backend deployment triggered successfully for commit SHA ${{ github.sha }}!"
